services:
  n8n:
    image: n8nio/n8n:2.37.4
    container_name: n8n-autonomous-agents
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh

      # Первый локальный запуск.
      # После создания owner account эти настройки можно оставить.
      - N8N_SECURE_COOKIE=false

    volumes:
      - D:\n8n\data:/home/node/.n8n