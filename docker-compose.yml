services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: n8n-autonomous-agents
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_SECURE_COOKIE=false
      - NODES_EXCLUDE=[]

    volumes:
      - D:\n8n\data:/home/node/.n8n
      - D:\n8n\scripts:/home/node/scripts